  <div class="c"><h3>موسیقی آرام‌بخش</h3><div class="chips"><button class="chip${p.music?' on':''}" onclick="S.profile.music=!S.profile.music;save();render()">پخش خودکار هنگام ورود: ${p.music?'روشن':'خاموش'}</button><button class="chip${playing?' on':''}" onclick="toggleMusic();render()">${playing?'توقف موسیقی':'پخش اکنون'}</button></div><label>آهنگ</label><div class="chips">${TRK.map((t,i)=>`<button class="chip${p.track===i?' on':''}" onclick="setTrack(${i})">${t[0]}</button>`).join('')}</div><label>میزان صدا</label><input class="rg" type="range" min="0.05" max="1" step="0.05" value="${p.vol}" oninput="setVol(this.value)"><small>صداها در مرورگر ساخته می‌شوند. مرورگرها پخش را بعد از اولین لمس صفحه اجازه می‌دهند.</small></div></div>
  <div class="c"><h3>مدال‌ها</h3><div class="bd">${badges().map(([t,ok])=>`<div class="bgd${ok?'':' off'}">${t}</div>`).join('')}</div></div>
  <div class="c"><h3>درس‌های من</h3>${S.subjects.map(s=>`<div class="row"><div><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</div><button class="x" onclick="delSub('${s.id}')">✕</button></div>`).join('')||'<div class="empty">هنوز درسی اضافه نکرده‌ای.</div>'}<div class="r3" style="margin-top:12px"><input class="in" id="sn" placeholder="نام درس، مثلاً ریاضی"><input class="in" id="sc" type="color" value="${COL[S.subjects.length%COL.length]}"><button class="b p" onclick="addSub()">افزودن</button></div></div>
  <div class="c"><button class="b" onclick="reset()">${pend==='all'?'مطمئنی؟ دوباره بزن':'پاک‌کردن همه‌ی داده‌ها'}</button></div>`}
/* ---- همراهان ---- */
let vc='';
function chars(){const cur=CUR(),o=CH.find(c=>c.id===vc)||cur,lv=(sum(S.sessions,x=>x.min)/300|0)+1;
  return `<div class="c"><h3>همراهان (${fa(CH.length)} شخصیت)</h3><div class="cg">${CH.map(c=>`<button class="cc${c.id===o.id?' on':''}" onclick="vc='${c.id}';render()">${por(c,62)}<b>${c.n}</b><small>${c.nick}</small></button>`).join('')}</div></div>
  <div class="c"><div class="say">${por(o,110,o.id===cur.id?mood():'ok')}<div><div class="who"><b>${o.n}</b> · ${o.nick}</div><small>${fa(o.age)} ساله · ${o.role}</small>${o.id===cur.id?'<span class="mood" style="color:var(--ac);background:var(--acs);margin:0">همراه فعلی</span>':''}</div></div>
  <h3 style="margin:16px 0 6px">داستان</h3><p>${o.s}</p><h3 style="margin:14px 0 6px">راز</h3>${lv>=4?`<p>${o.x}</p>`:`<p class="lock">قفل است؛ با رسیدن به سطح ${fa(4)} باز می‌شود (الان سطح ${fa(lv)}).</p>`}
  <h3 style="margin:14px 0 0">حالت‌ها</h3><div class="ms">${['ok','happy','sad','angry'].map(k=>`<div>${por(o,58,k)}<small>${ML[k][0]}</small></div>`).join('')}</div>
  <button class="b p" onclick="pick('${o.id}')">انتخاب به‌عنوان همراه</button></div>`}
/* ---- موسیقی آرام‌بخش (تولید صدا با Web Audio) ---- */
let AC,MG,SN,WB,BB,stops=[],playing=false;
function aud(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();SN=AC.createGain();const dl=AC.createDelay(1),fb=AC.createGain();dl.delayTime.value=.42;fb.gain.value=.45;SN.gain.value=.5;MG.connect(AC.destination);SN.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(MG);
  const mk=b=>{const x=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=x.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(b){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.5}return x};WB=mk(0);BB=mk(1)}
  if(AC.state==='suspended')AC.resume();return AC}
const noise=(buf,type,f,g)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=buf;s.loop=true;fl.type=type;fl.frequency.value=f;gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(MG);s.start();stops.push(()=>{try{s.stop()}catch(e){}});return gn};
const tone=(f,d,type,v,att)=>{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);g.connect(SN);o.start(t);o.stop(t+d+.1)};
const mid=n=>440*2**((n-69)/12),rnd=a=>a[Math.random()*a.length|0],every=(f,ms)=>{f();const i=setInterval(f,ms);stops.push(()=>clearInterval(i))},PENT=[60,62,64,67,69,72,74,76];
const TRK=[
['باران آرام',()=>{noise(WB,'bandpass',3200,.16);every(()=>tone(2000+Math.random()*2500,.12,'sine',.015),260)}],
['امواج دریا',()=>{const g=noise(BB,'lowpass',700,.22),l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.1;lg.gain.value=.16;l.connect(lg);lg.connect(g.gain);l.start();stops.push(()=>{try{l.stop()}catch(e){}})}],
['پیانوی شبانه',()=>every(()=>{tone(mid(rnd(PENT)),4,'triangle',.11);if(Math.random()<.3)tone(mid(rnd([36,41,43])),5,'sine',.12)},2300)],
['زنگ‌های معبد',()=>every(()=>{const f=mid(rnd(PENT)+12);tone(f,6,'sine',.07);tone(f*2.76,2.5,'sine',.025)},3600)],
['فضای آرام',()=>{const CD=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];let k=0;every(()=>{CD[k++%4].forEach(n=>{tone(mid(n),9,'sine',.06,3.5);tone(mid(n)*1.003,9,'triangle',.02,3.5)})},7000)}],
['باران و پیانو',()=>{TRK[0][1]();TRK[2][1]()}]];
function musicUI(){const b=$('#mb');if(!b)return;b.innerHTML=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/>${playing?'<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>':'<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;b.style.color=playing?'var(--ac)':''}
function stopSilent(){stops.forEach(f=>f());stops=[]}
function startMusic(){try{aud();stopSilent();playing=true;MG.gain.value=0;MG.gain.setTargetAtTime(S.profile.vol,AC.currentTime,.8);TRK[S.profile.track%TRK.length][1]()}catch(e){playing=false;toast('پخش صدا در این مرورگر ممکن نیست')}musicUI()}
function stopMusic(){playing=false;if(AC)MG.gain.setTargetAtTime(0,AC.currentTime,.3);setTimeout(()=>{if(!playing)stopSilent()},1200);musicUI()}
function toggleMusic(){if(playing){stopMusic();toast('موسیقی متوقف شد')}else{startMusic();if(playing)toast('در حال پخش: '+TRK[S.profile.track%TRK.length][0])}}
function setTrack(i){S.profile.track=i;save();if(playing)startMusic();render()}
function setVol(v){S.profile.vol=+v;save();if(AC&&playing)MG.gain.value=S.profile.vol}
function initMusic(){musicUI();if(!S.profile.music)return;const go=e=>{if(e.target.closest&&e.target.closest('#mb'))return;removeEventListener('click',go);removeEventListener('keydown',go);if(!playing&&S.profile.music){startMusic();if(playing)toast('موسیقی آرام‌بخش فعال شد')}};addEventListener('click',go);addEventListener('keydown',go)}
const TABS=[['home','خانه',home],['plan','برنامه',plan],['log','ثبت',log],['stats','گزارش',stats],['chars','همراهان',chars],['profile','هویت',prof]];

let tab=S.profile.name?'home':'profile';
function go(k){tab=k;pend='';render()}
function render(){
  const t=TABS.find(x=>x[0]===tab),v=$('#v');
  $('#nav').innerHTML=TABS.map(x=>`<button class="ni${x[0]===tab?' on':''}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24">${IC[x[0]]}</svg>${x[1]}</button>`).join('');
  $('#h').textContent=t[1];
  $('#sub').textContent=tab==='profile'&&!S.profile.name?'اول اسم، اسم مستعار و همراهت را انتخاب کن':jd(today(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  v.innerHTML=t[2]();v.querySelectorAll('.c').forEach((e,i)=>e.style.setProperty('--i',i));
}
apply();petals();render();initMusic();
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
