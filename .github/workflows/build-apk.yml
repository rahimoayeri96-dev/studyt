
name: Build APK with Bubblewrap
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli
      
    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Build APK
      run: bubblewrap build --skipPwaValidation
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudyTrack-APK
        path: ./app-release-signed.apk
